<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22"/>
      <stop offset="50%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#021c16"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle with gold border -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="496" height="496" x="8" y="8" rx="104" fill="none" stroke="url(#gold)" stroke-width="6" opacity="0.6"/>

  <!-- Subtle Islamic Geometric Rosette background -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#10b981" stroke-width="1.5" opacity="0.15"/>
  <circle cx="256" cy="256" r="140" fill="none" stroke="#f59e0b" stroke-width="1.5" opacity="0.2"/>

  <!-- Crescent Moon -->
  <path d="M 285 130 A 135 135 0 1 0 380 320 A 108 108 0 1 1 285 130 Z" fill="url(#gold)" filter="url(#glow)"/>

  <!-- Five Point Star in Crescent -->
  <polygon points="360,195 368,218 392,218 372,232 380,255 360,240 340,255 348,232 328,218 352,218" fill="#fde68a" filter="url(#glow)"/>

  <!-- Arabic Calligraphy Letter Haa (ح) for Habibi & Halal -->
  <text x="235" y="325" font-family="'Amiri', 'Traditional Arabic', serif" font-size="160" font-weight="bold" fill="#fef3c7" text-anchor="middle" filter="url(#glow)">ح</text>

  <!-- Islamic Habibi Banner Text -->
  <text x="256" y="420" font-family="'Cinzel', serif" font-size="34" font-weight="bold" fill="#fde68a" text-anchor="middle" letter-spacing="4">ISLAMIC HABIBI</text>
  <text x="256" y="450" font-family="sans-serif" font-size="16" font-weight="600" fill="#a7f3d0" text-anchor="middle" letter-spacing="2">ZAWAJ &amp; NIKAH APP</text>
</svg>
